name: Refresh Demo

on:
  workflow_dispatch: {}                 # 允许在 GitHub Actions 页面手动触发
  push:
    paths:
      - ".github/workflows/main.yml"    # 当这个 workflow 文件被修改并推送时触发

permissions:
  contents: write                       # 允许 workflow 提交代码并推送到仓库

jobs:
  refresh-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'

      - name: Build project with shadcn
        shell: bash
        run: |
          rm -rf temp-app

          npx --yes create-next-app@latest temp-app \
            --yes \
            --ts \
            --eslint \
            --tailwind \
            --app \
            --src-dir \
            --turbopack \
            --import-alias "@/*"

          npx --yes shadcn@latest init \
            --cwd temp-app \
            --base radix \
            --preset nova \
            --css-variables \
            -y

          npx --yes shadcn@latest add \
            --cwd temp-app \
            --all \
            --overwrite \
            -y

          shopt -s dotglob nullglob

          for item in * .*; do
            case "$item" in
              .|..|.git|temp-app) continue ;;
              *) rm -rf "$item" ;;
            esac
          done

          cp -a temp-app/. .
          rm -rf temp-app

      - name: Install & Build
        shell: bash
        run: |
          npm install
          npm run build || true

      - name: Commit & Force Push Demo branch
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d %H:%M:%S")

          git checkout --orphan Demo
          git rm -rf --cached . 2>/dev/null || true
          git add -A
          git commit -m "$TIME"
          git push --force origin Demo
